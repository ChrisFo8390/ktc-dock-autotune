# Dock autotune - include this file in printer.cfg AFTER dock_autotune.py is installed
# (otherwise Klipper stops with "Section 'dock_autotune' is not a valid config section"):
#   [include dock_autotune.cfg]

[dock_autotune]
# Step of the scan in mm. With refine the interval at the edge of the window is halved until it is
# not larger than resolution (for step 0.2 and resolution 0.05: two extra trials per edge).
step: 0.1
resolution: 0.05
# Largest deviation from the current park value that is tried, per axis (mm).
# Keep them small: a failing pickup next to the window is harmless, a position that is
# far off may hit the dock. Y is smaller than X because the dock is deep in Y.
range_x: 0.6
range_y: 0.5
range_z: 0.5
# Pickups per candidate. All of them have to lock.
repeats: 2
refine: True
# Path speed factor (of params_path_speed) and acceleration while the scan runs
speed_factor: 0.5
accel: 2000
# Pause after each pickup/dropoff before the next one (s)
settle: 0.3
# Safety net: stop after this many pickups
max_cycles: 400

# Preparation like a print start. DOCK_AUTOTUNE detects the probe (Cartographer, Beacon, eddy
# current, ...) and offers the preparation in a prompt: bed temperature, G28, gantry levelling,
# touch homing with the touch tool, tool back into its dock.
# Bed temperature the prompt starts with (change it with the buttons or BED=)
bed_temp: 70
# Wait this long (s) after the bed has reached its temperature
bed_soak: 0
# Touch homing: auto (detected: CARTOGRAPHER_TOUCH_HOME, or G28 Z for Beacon with home_method
# contact), none, or a G-code line of your own
touch_command: auto
# The tool the touch homing is done with, its nozzle temperature and how often it is repeated
# (use what your PRINT_START uses - the Z reference depends on it)
touch_tool: 0
touch_temp: 150
touch_repeats: 2
# Axes that the pickup of the touch tool brings back to where they were before (like the T command in a
# PRINT_START). Z: the touch homing starts low, not at the height of the dock. Empty: no restore.
touch_restore_axis: Z
# G-code that runs with the touch tool on the shuttle while its nozzle heats up to touch_temp
# (one command per line), for example a nozzle cleaning macro like in a PRINT_START
# before_touch:
#     BRUSH

# Optional accelerometer of the tool, used with DOCK_AUTOTUNE ... ADXL=1.
# The sections have to be named per tool ([adxl345 T0] ... [adxl345 T4]), an unnamed
# [adxl345] in every tool cfg is merged by Klipper into a single chip.
# accelerometer: adxl345 T{tool}
# Stop the scan if a trial shows a shock above this (g, 0 = never). Look at the values in
# the log of a normal scan first (peak_g), then set something clearly above them.
# abort_g: 0

# Where the results of every trial are written (one JSON object per line)
# log_file: ~/printer_data/logs/dock_autotune.jsonl
