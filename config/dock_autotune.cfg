# Dock autotune - include this file in printer.cfg AFTER dock_autotune.py is installed
# (otherwise Klipper stops with "Section 'dock_autotune' is not a valid config section"):
#   [include dock_autotune/dock_autotune.cfg]
# The installer puts it into the folder dock_autotune/ of your config directory; the result files of
# the runs are written to dock_autotune/results/.

[dock_autotune]
# What DOCK_AUTOTUNE does when you give nothing else. Every one of these can be overridden in the
# command (MODE=, AXES=, PREPARE=, TOOLS=).
# seat: the shuttle lifts into the tool and goes down again without taking it out of its dock, and
# the accelerometer measures the height of the contact and the sideways push at positions along X
# and Y. Changes nothing, needs [adxl345 T<n>].
# scan: find the window in which the tool locks (pickups and dropoffs) and centre the dock position.
mode: seat
# Axes of the scan (the seat test uses X and Y)
axes: xyz
# The tools that DOCK_AUTOTUNE works on when you give neither T= nor TOOLS=: 0,1,2 or 0-4 or all.
# Several tools are done in one run: one preparation, then the tools one after the other, and one
# result file with the park positions of all of them. Without it a click on the macro opens a
# prompt that asks for the tool.
# tools: 0-4
# ask: prompt (Mainsail / Fluidd) with the preparation. yes: always prepare the machine first.
# no: the machine is prepared already (bed temperature, G28, levelling, touch homing)
prepare: ask

# --- Seat test (MODE=seat) --------------------------------------------------------------------
# The first lift runs at path speed and finds the contact, the later ones go slowly (seat_speed,
# mm/s) through the last seat_zone mm below the first knock up to the verify waypoint. The positions
# go seat_range mm to both sides of the park position along X and Y in seat_step steps,
# seat_repeats lifts each. A side ends after seat_fail_stop positions in a row where the tool
# detection was off at the top.
seat_speed: 2
seat_zone: 1.5
seat_range: 1.0
seat_step: 0.25
seat_repeats: 3
# seat_fail_stop: 2
# Smallest knock in g that counts (0: automatic, 6 times the noise but at least 0.5 g). Lower it if
# the slow lifts show no events.
# seat_threshold: 0
# Window (s) of the high-pass that removes gravity and the smooth acceleration of the moves (the knocks), and
# of the longer one that keeps the slow sideways wobble of the tool in the dock
# adxl_window: 0.05
# wobble_window: 0.2
# Accelerometer of the tool. Nothing to set here if the chips are named per tool ([adxl345 T0] ...
# [adxl345 T4], as in the tool cfgs): that is the default. Only set this if your chips have other
# names, T{tool} is replaced by the tool number.
# accelerometer: adxl345 T{tool}

# --- Scan (MODE=scan) -------------------------------------------------------------------------
# Step of the scan in mm. With refine the interval at the edge of the window is halved until it is
# not larger than resolution (for step 0.2 and resolution 0.05: two extra trials per edge).
step: 0.1
resolution: 0.05
# Largest deviation from the current park value that is tried, per axis (mm).
# Keep them small: a failing pickup next to the window is harmless, a position that is
# far off may hit the dock. Y is smaller than X because the dock is deep in Y.
range_x: 0.6
range_y: 0.5
range_z: 0.5
# Pickups per candidate. All of them have to lock.
repeats: 2
refine: True
# Path speed factor (of params_path_speed) and acceleration while the scan runs
speed_factor: 0.5
accel: 2000
# Pause after each pickup/dropoff before the next one (s)
settle: 0.3
# Safety net: stop after this many pickups or lifts
max_cycles: 400

# --- Preparation like a print start -------------------------------------------------------------
# DOCK_AUTOTUNE detects the probe (Cartographer, Beacon, eddy current, ...) and offers the
# preparation in a prompt: bed temperature, G28, gantry levelling, touch homing with the touch
# tool, tool back into its dock.
# Bed temperature the prompt starts with (change it with the buttons or BED=)
bed_temp: 70
# Wait this long (s) after the bed has reached its temperature
bed_soak: 0
# Touch homing: auto (detected: CARTOGRAPHER_TOUCH_HOME, or G28 Z for Beacon with home_method
# contact), none, or a G-code line of your own
touch_command: auto
# The tool the touch homing is done with, its nozzle temperature and how often it is repeated
# (use what your PRINT_START uses - the Z reference depends on it). The nozzle is heated and waited for
# first, then before_touch runs (brush), then the temperature is waited for again and the touch homing runs
touch_tool: 0
touch_temp: 150
touch_repeats: 1
# Axes that the pickup of the touch tool brings back to where they were before (like the T command in a
# PRINT_START). Z: the touch homing starts low, not at the height of the dock. Empty: no restore.
touch_restore_axis: Z
# G-code that runs with the touch tool on the shuttle while its nozzle is heated up to touch_temp
# (one command per line), for example a nozzle cleaning macro like in a PRINT_START
# before_touch:
#     BRUSH

# --- Files ---------------------------------------------------------------------------------------
# The result file of every run (park positions before / after, the measurements or the trials of the
# scan, all numbers as CSV). Empty: no file
# results_dir: ~/printer_data/config/dock_autotune/results
# Where the results of every scan trial are written (one JSON object per line)
# log_file: ~/printer_data/logs/dock_autotune.jsonl
