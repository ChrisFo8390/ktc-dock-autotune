# Puts DOCK_AUTOTUNE into the macro list of Mainsail / Fluidd / HelixScreen.
#
# Those UIs list only [gcode_macro] sections. A command that a Klipper module registers is not shown
# there, although it works in the console. This macro carries the name DOCK_AUTOTUNE and hands
# everything on to the command of the module, DOCK_AUTOTUNE_RUN. The module notices the macro and
# does not register the name DOCK_AUTOTUNE itself. Mainsail shows an input field for every
# params.<NAME> that appears in the macro.
#
# Do NOT add rename_existing here: Mainsail hides macros that have it.
#
# Include it together with dock_autotune.cfg (the order does not matter):
#   [include dock_autotune/dock_autotune.cfg]
#   [include dock_autotune/dock_autotune_macro.cfg]
# This file needs dock_autotune.py (version with DOCK_AUTOTUNE_RUN), otherwise the macro fails when it runs.

[gcode_macro DOCK_AUTOTUNE]
description: Find and centre the dock position of a tool. T=N for one tool or TOOLS=0,1,2 (0-4, all) for several, DRY_RUN=1 only shows the plan
gcode:
    # The fields of the UI: T (tool), TOOLS (0,1,2 or 0-4 or all), AXES (xyz), RANGE (mm), STEP (mm), REPEATS, SPEED (0-1),
    # BED (deg C), SOAK (s), PREPARE (0/1), TOUCH (0/1), ADXL (0/1), MODE (scan/map/seat), RAW (0/1), DRY_RUN (0/1)
    {% set fields = [params.T, params.TOOLS, params.AXES, params.RANGE, params.STEP, params.REPEATS, params.SPEED,
                     params.BED, params.SOAK, params.PREPARE, params.TOUCH, params.ADXL, params.MODE, params.RAW,
                     params.DRY_RUN] %}
    DOCK_AUTOTUNE_RUN {rawparams}
