# Puts DOCK_AUTOTUNE into the macro list of Mainsail / Fluidd / HelixScreen.
#
# Those UIs list only [gcode_macro] sections. A command that a Klipper module registers (like
# DOCK_AUTOTUNE) is not shown there, although it works in the console. This macro takes over the
# name and hands everything on to the module (renamed to DOCK_AUTOTUNE_BASE). Mainsail shows an
# input field for every params.<NAME> that appears in the macro.
#
# Include it together with dock_autotune.cfg (the order does not matter, Klipper renames at connect):
#   [include dock_autotune.cfg]
#   [include dock_autotune_macro.cfg]
# Without the module (dock_autotune.py) Klipper stops at start: "Existing command 'DOCK_AUTOTUNE' not found".

[gcode_macro DOCK_AUTOTUNE]
rename_existing: DOCK_AUTOTUNE_BASE
description: Find and centre the dock position of a tool. T=<n> is required, DRY_RUN=1 only shows the plan
gcode:
    # The fields of the UI: T (tool), AXES (xyz), RANGE (mm), STEP (mm), REPEATS, SPEED (0-1),
    # BED (deg C), SOAK (s), PREPARE (0/1), TOUCH (0/1), ADXL (0/1), DRY_RUN (0/1)
    {% set fields = [params.T, params.AXES, params.RANGE, params.STEP, params.REPEATS, params.SPEED,
                     params.BED, params.SOAK, params.PREPARE, params.TOUCH, params.ADXL, params.DRY_RUN] %}
    {% if params.T is not defined or params.T|string|trim == '' %}
        { action_raise_error("DOCK_AUTOTUNE: T=<tool number> is required, for example DOCK_AUTOTUNE T=1 DRY_RUN=1") }
    {% endif %}
    DOCK_AUTOTUNE_BASE {rawparams}
